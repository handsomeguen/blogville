# 서버의 Blogville 상태를 본다 (Actions → status → Run workflow). 아무것도 바꾸지 않는다.
name: status

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: 서버 주소 정리
        env:
          SSH_ADDRESS: ${{ secrets.SSH_ADDRESS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          h=$(printf '%s' "$SSH_ADDRESS" | tr -d '[:space:]' | sed -E 's#^[a-zA-Z]+://##; s#/.*##; s#.*@##; s#:[0-9]+$##')
          echo "::add-mask::$h"
          p=$(printf '%s' "$SSH_PORT" | tr -d '[:space:]')
          { echo "SSH_HOST=$h"; echo "SSH_PORT=${p:-22}"; } >> "$GITHUB_ENV"

      - name: 서버 상태
        uses: appleboy/ssh-action@v1.2.0
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: ADMIN_USERNAME,ADMIN_PASSWORD
          script: |
            D=docker; docker info >/dev/null 2>&1 || D="sudo -n docker"
            echo "== 컨테이너"; $D ps -a --filter name=bv8400- --format '{{.Names}} {{.Status}} {{.Image}}'
            echo "== 8400 포트"; (ss -ltnp 2>/dev/null || netstat -ltn 2>/dev/null) | grep -E ':8400\b' || echo "8400을 듣는 곳이 없어요"
            echo "== 서버 안에서 열기"; for u in http://127.0.0.1:8400/ http://$(hostname -I | awk '{print $1}'):8400/; do echo "$u -> $(curl -s -o /dev/null -m 10 -w '%{http_code}' $u || echo 실패)"; done
            echo "== 서버 IP"; hostname -I
            echo "== nginx가 보내는 앱 (upstream.conf)"; grep -E '^\s*server ' ~/blogville/nginx/conf.d/upstream.conf 2>/dev/null || echo "아직 nginx 전 구성이에요"
            echo "== 답한 앱"; curl -sI -m 10 http://127.0.0.1:8400/ | grep -i '^x-bv8400-upstream' || echo "머리에 없음"
            echo "== 상태 확인 (/api/health: 버전·DB)"; curl -s -m 10 -w ' HTTP %{http_code}\n' http://127.0.0.1:8400/api/health || echo "응답 없음"
            ACTIVE=$(cat ~/blogville/state/active 2>/dev/null || echo blue); APP="bv8400-$ACTIVE"; echo "== 서비스 중: $APP"
            echo "== 관리자 계정 점검 (값은 찍지 않음)"; $D exec -e ADMIN_USERNAME="$ADMIN_USERNAME" -e ADMIN_PASSWORD="$ADMIN_PASSWORD" "$APP" node scripts/check-admin.mjs || echo "점검 스크립트가 없는 버전이에요 (다음 배포 뒤 다시)"
            echo "== 주식 상태 (/api/stocks/status)"; curl -s -m 20 http://127.0.0.1:8400/api/stocks/status | head -c 6000; echo
            echo "== 주식 시세 (/api/stocks/quotes?blog=ckd3298)"; curl -s -m 20 "http://127.0.0.1:8400/api/stocks/quotes?blog=ckd3298" | head -c 6000; echo
            echo "== 최근 로그"; $D logs --tail 30 "$APP" 2>&1 | grep -vE "collation|severity|01000|detail:|hint:|file:|line:|routine:|^\{|^\}" | tail -30
