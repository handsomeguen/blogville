# 서버의 Blogville 상태를 본다 (Actions → status → Run workflow). 아무것도 바꾸지 않는다.
name: status

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: 서버 주소 정리
        env:
          SSH_ADDRESS: ${{ secrets.SSH_ADDRESS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          h=$(printf '%s' "$SSH_ADDRESS" | tr -d '[:space:]' | sed -E 's#^[a-zA-Z]+://##; s#/.*##; s#.*@##; s#:[0-9]+$##')
          echo "::add-mask::$h"
          p=$(printf '%s' "$SSH_PORT" | tr -d '[:space:]')
          { echo "SSH_HOST=$h"; echo "SSH_PORT=${p:-22}"; } >> "$GITHUB_ENV"

      - name: 서버 상태
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            D=docker; docker info >/dev/null 2>&1 || D="sudo -n docker"
            echo "== 컨테이너"; $D ps -a --filter name=blogville --format '{{.Names}} {{.Status}} {{.Image}}'
            A=$(cat ~/blogville/active 2>/dev/null || true); echo "== 지금 쓰는 쪽: ${A:-없음(예전 방식)}"
            echo "== 8400 포트"; (ss -ltnp 2>/dev/null || netstat -ltn 2>/dev/null) | grep -E ':8400\b' || echo "8400을 듣는 곳이 없어요"
            echo "== 서버 안에서 열기"; for u in http://127.0.0.1:8400/ http://$(hostname -I | awk '{print $1}'):8400/; do echo "$u -> $(curl -s -o /dev/null -m 10 -w '%{http_code}' $u || echo 실패)"; done
            echo "== 서버 IP"; hostname -I
            echo "== 최근 로그"; $D logs --tail 30 blogville${A:+-$A} 2>&1 | grep -vE "collation|severity|01000|detail:|hint:|file:|line:|routine:|^\{|^\}" | tail -30
